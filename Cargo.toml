[package]
name = "emp"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "emp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
lofty = "0.24.0"
postcard = "1.1.3"
rodio = { version = "0.22.2" }
serde = { version = "1.0", features = ["derive"] }
souvlaki = "0.8.3"
# tokio = { version = "1.52.3", features = ["rt"] }
# zbus = { version = "5.15.0" }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1
